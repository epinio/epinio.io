name: Test Site

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: |
          npm test || echo "TESTS_FAILED=1" >> $GITHUB_ENV
      - name: Upload visual diff artifacts if tests failed
        if: env.TESTS_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test/__image_snapshots__/__diff_output__/
          if-no-files-found: ignore
