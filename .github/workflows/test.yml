name: Test Site

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Upload visual diff artifacts if tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test/__image_snapshots__/__diff_output__/
          if-no-files-found: ignore
      - name: Generate PR comment with base64 diff images
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo '## :warning: Visual Regression Test Failed' > pr-comment.md
          echo 'Visual differences were detected in the homepage screenshot(s).' >> pr-comment.md
          for img in test/__image_snapshots__/__diff_output__/*.png; do
            if [ -f "$img" ]; then
              echo "\n<details><summary>Diff image: $(basename "$img")</summary>" >> pr-comment.md
              echo '<img src="data:image/png;base64,'$(base64 -w 0 "$img")'" />' >> pr-comment.md
              echo '</details>' >> pr-comment.md
            fi
          done
      - name: Post visual diff images to PR (inline)
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-comment.md
