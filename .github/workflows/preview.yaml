name: PR Preview

# Builds every same-repo PR on Epinio, deploys the stored build in a separate
# job, and deletes the app when the PR closes. Build and deploy run on
# different runners on purpose: deploy has no source checkout, so it can only
# succeed by deploying the image `epinio app build` stored.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_NAME: epinio-io-pr-${{ github.event.pull_request.number }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}

  build:
    needs: check
    # Fork PRs get no secrets, so they stop after check.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Epinio
        # main as of 2026-11-13; the action has no release tags yet
        uses: epinio/setup-epinio-action@2011da02bc65b43863b233a2b31ee482ba143db8
        with:
          version: server
          url: ${{ secrets.EPINIO_URL }}
          user: ${{ secrets.EPINIO_USER }}
          password: ${{ secrets.EPINIO_PASSWORD }}
          namespace: ${{ secrets.EPINIO_NAMESPACE }}

      - name: Build and store image
        run: >-
          epinio app build
          --name "$APP_NAME"
          --path .
          --env "PUBLIC_API_URL=$PUBLIC_API_URL"
          --env "PUBLIC_RECAPTCHA_SITE_KEY=$PUBLIC_RECAPTCHA_SITE_KEY"
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to deploy on approval
    # while still building on every push.
    environment:
      name: preview
      url: ${{ steps.route.outputs.url }}
    steps:
      - name: Setup Epinio
        uses: epinio/setup-epinio-action@2011da02bc65b43863b233a2b31ee482ba143db8
        with:
          version: server
          url: ${{ secrets.EPINIO_URL }}
          user: ${{ secrets.EPINIO_USER }}
          password: ${{ secrets.EPINIO_PASSWORD }}
          namespace: ${{ secrets.EPINIO_NAMESPACE }}

      - name: Deploy stored build
        run: epinio app deploy "$APP_NAME"

      - name: Read route
        id: route
        run: |
          route=$(epinio app show "$APP_NAME" -o json \
            | jq -r '.configuration.routes[0]')
          echo "url=https://$route" >> "$GITHUB_OUTPUT"

  teardown:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Setup Epinio
        uses: epinio/setup-epinio-action@2011da02bc65b43863b233a2b31ee482ba143db8
        with:
          version: server
          url: ${{ secrets.EPINIO_URL }}
          user: ${{ secrets.EPINIO_USER }}
          password: ${{ secrets.EPINIO_PASSWORD }}
          namespace: ${{ env.EPINIO_NAMESPACE }}

      - name: Delete preview app
        run: |
          if epinio app show "$APP_NAME" > /dev/null 2>&1; then
            epinio app delete "$APP_NAME" --delete-image
          else
            echo "No preview app $APP_NAME, nothing to delete"
          fi
