baseURL = ""
languageCode = "en-us"
theme = "hugo-material"
title = "Epinio"
pluralizeListTitles = false
enableRobotsTXT = true
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true
enableGitInfo = true
# # Disable google analytics for now, due to deprecation notice and site transfer
# googleAnalytics = 'UA-56382716-12'
disableKinds = ["section", "taxonomy", "RSS", "sitemap", "robotsTXT", "404"]

[blackfriday]
  fractions = false
  #hrefTargetBlank = true

[params]
  # rename when the logo is updated, so we indirectly also invalidate caches
  logo = "images/epinio-logo-header.png"
  githubLink = "https://github.com/epinio/epinio"
  docsLink = "https://docs.epinio.io/"
  css = ["css/custom.css"]
  favicon = "images/favicon.ico"
  github = "https://github.com/epinio/epinio"

  custom_css = ["custom.css", "font.css"]
  version = "1.1.1"
  
[outputs]
  home = ["HTML", "RSS"]

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.x]
    disable = false
    enableDNT = false
    simple = true

